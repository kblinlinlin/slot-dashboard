<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>站点已下线</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f6;
        --panel: #ffffff;
        --ink: #17212b;
        --muted: #667085;
        --line: #d9e1e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(560px, 100%);
        padding: 32px 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>站点已临时下线</h1>
      <p>该页面因安全原因暂停访问。请联系维护人员获取后续安排。</p>
    </main>
  </body>
</html>
